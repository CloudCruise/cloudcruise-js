name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Check if version already published
        id: check
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VERSION already on npm, skipping publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tarball contains build output
        if: steps.check.outputs.publish == 'true'
        run: npm pack --dry-run 2>&1 | grep -q "dist/index.js" || { echo "dist/index.js missing from package"; exit 1; }

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true'
        run: gh release create "v${{ steps.check.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
