name: Backend Compatibility Check

# Verifies the current SDK still works against a real, running CloudCruise
# backend. `CloudCruise.ts` deliberately restricts baseUrl to prod/staging to
# stop an API key ever being sent to an unapproved host, so this workflow
# patches that allowlist to include exactly one CI-supplied URL, builds from
# the patched source into a throwaway output directory, and runs a read-only
# smoke check against it. The patched source is never committed and this job
# has no publish credentials (see publish.yml's separate `npm-publish`
# environment) — nothing built here can reach npm.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Backend URL to test against"
        required: true

permissions:
  contents: read

jobs:
  compat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Patch base URL allowlist for this test run only
        run: |
          grep -q "new Set(\[DEFAULT_BASE_URL, STAGING_BASE_URL\])" src/CloudCruise.ts || {
            echo "::error::allowlist pattern not found in src/CloudCruise.ts — refusing to run unpatched"
            exit 1
          }
          sed -i "s#new Set(\[DEFAULT_BASE_URL, STAGING_BASE_URL\])#new Set([DEFAULT_BASE_URL, STAGING_BASE_URL, process.env.COMPAT_TEST_BASE_URL])#" src/CloudCruise.ts

      - run: pnpm build

      - name: Run compatibility smoke test
        run: node scripts/compat-smoke.mjs
        env:
          COMPAT_TEST_BASE_URL: ${{ inputs.base_url }}
          CLOUDCRUISE_API_KEY: ${{ secrets.COMPAT_TEST_API_KEY }}
